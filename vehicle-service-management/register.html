<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Account | Vehicle Service Management System</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); justify-content: center; align-items: center; padding: 2.5rem 1rem;">

  <div style="width: 100%; max-width: 520px; margin: auto;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="index.html" class="brand-logo" style="justify-content: center; color: #fff;">
        <div class="logo-icon"><i class="fa-solid fa-car-burst"></i></div>
        <div class="logo-text">VSMS <span>AutoCare</span></div>
      </a>
      <p style="color: #94a3b8; font-size: 0.9rem; margin-top: 0.5rem;">Join thousands of vehicle owners managing maintenance effortlessly</p>
    </div>

    <div class="dashboard-card" style="border: 1px solid rgba(255,255,255,0.1); box-shadow: var(--shadow-xl);">
      <div class="dashboard-card-body" style="padding: 2.25rem;">
        <h2 style="font-size: 1.5rem; margin-bottom: 1.5rem; text-align: center;">Create New Account</h2>

        <form onsubmit="handleRegister(event)">
          <div class="form-group" style="margin-bottom: 1rem;">
            <label><i class="fa-solid fa-user text-accent"></i> Full Name *</label>
            <input type="text" id="reg-name" class="form-control" placeholder="e.g. Rahul Sharma" required>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
            <div class="form-group">
              <label><i class="fa-solid fa-envelope text-accent"></i> Email *</label>
              <input type="email" id="reg-email" class="form-control" placeholder="rahul@example.com" required>
            </div>
            <div class="form-group">
              <label><i class="fa-solid fa-phone text-accent"></i> Mobile No *</label>
              <input type="tel" id="reg-phone" class="form-control" placeholder="+91 98765 43210" required>
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 1rem;">
            <label><i class="fa-solid fa-user-gear text-accent"></i> Select Account Type / Role *</label>
            <select id="reg-role" class="form-control" required>
              <option value="customer" selected>Customer (Vehicle Owner)</option>
              <option value="advisor">Service Advisor</option>
              <option value="technician">Technician / Mechanic</option>
              <option value="inventory">Inventory Manager</option>
              <option value="admin">System Administrator</option>
            </select>
          </div>

          <div class="form-group" style="margin-bottom: 1rem;">
            <label><i class="fa-solid fa-location-dot text-accent"></i> Residential / Workshop Address</label>
            <input type="text" id="reg-address" class="form-control" placeholder="e.g. Flat 301, Marine Drive, Mumbai">
          </div>

          <div class="form-group" style="margin-bottom: 1.5rem;">
            <label><i class="fa-solid fa-lock text-accent"></i> Password *</label>
            <input type="password" id="reg-password" class="form-control" placeholder="Minimum 6 characters" required>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-bottom: 1rem;">
            <i class="fa-solid fa-user-plus"></i> Complete Registration
          </button>
        </form>

        <div style="text-align: center; font-size: 0.85rem; color: var(--text-muted);">
          Already have an account? <a href="login.html" class="font-bold">Sign In here</a>
        </div>
      </div>
    </div>

    <div style="text-align: center; margin-top: 1.5rem;">
      <a href="index.html" style="color: #94a3b8; font-size: 0.85rem;"><i class="fa-solid fa-arrow-left"></i> Return to Homepage</a>
    </div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
